[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-toxicity-checker"
version = "0.1.0"
description = "Identify a plant species from a photo and check whether it is toxic to cats."
requires-python = ">=3.10"

[project.scripts]
plant-toxicity-checker = "plant_toxicity_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: needs the pretrained checkpoint / network (run with -m slow)",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "D100", "I"]

[tool.ruff.lint.per-file-ignores]
# Exploratory plotting cells: keep the real checks (unused names, import
# order) but not the 79-column / one-statement-per-line style.
"*.ipynb" = ["E501", "E701", "E702"]
